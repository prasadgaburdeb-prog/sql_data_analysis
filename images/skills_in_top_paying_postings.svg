  <g fill="#cf8b16"><rect x="190" y="112" width="467" height="27" rx="4"/><rect x="190" y="162" width="400" height="27" rx="4"/><rect x="190" y="212" width="333" height="27" rx="4"/><rect x="190" y="262" width="200" height="27" rx="4"/><rect x="190" y="312" width="200" height="27" rx="4"/><rect x="190" y="362" width="200" height="27" rx="4"/></g>
