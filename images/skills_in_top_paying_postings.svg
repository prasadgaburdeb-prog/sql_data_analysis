  <text x="42" y="74" font-family="Arial, sans-serif" font-size="14" fill="#58677c">Number of distinct postings mentioning each skill · 9 postings with skill records</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#28384d">
    <text x="42" y="133">Python</text><text x="42" y="183">SQL</text><text x="42" y="233">R</text><text x="42" y="283">Excel</text><text x="42" y="333">Looker</text><text x="42" y="383">Tableau</text>
  </g>
